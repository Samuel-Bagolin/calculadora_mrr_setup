<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador Rápido de Bônus - Setup Tecnologia</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .verifier-container {
            background-color: #ffffff;
            padding: 35px 45px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }
        .logo-container {
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 160px;
        }
        h1 {
            font-size: 22px;
            color: #1a253c;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        input[type="number"], select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 18px;
        }
        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
            text-align: center;
        }
        .result-card {
            background-color: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .result-card .label {
            font-size: 14px;
            color: #657786;
            margin-bottom: 8px;
        }
        .result-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #1a253c;
        }
        #statusResult .value {
            font-size: 18px;
            font-weight: 600;
        }
        #bonusResult .value {
            color: #2f855a; /* Verde para o bônus final */
        }
        #discountResult .value {
            color: #c53030; /* Vermelho para o desconto */
        }
    </style>
</head>
<body>

    <div class="verifier-container">
        <div class="logo-container">
            <img src="https://setuptecnologia.com.br/wp-content/uploads/elementor/thumbs/logo_setup-qzezn9i5idblppgmhvno0kn9is05zyuu0k7oiqtb7k.png" alt="Logo Setup Tecnologia">
        </div>
        <h1>Verificador Rápido de Bônus</h1>

        <div class="form-group">
            <label for="teamSelect">Selecione seu Time</label>
            <select id="teamSelect">
                <option value="acessorias_onboarding">Acessorias - Onboarding</option>
                <option value="acessorias_ongoing">Acessorias - Ongoing</option>
                <option value="sittax_openix_onboarding">Sittax/Openix - Onboarding</option>
                <option value="sittax_openix_ongoing">Sittax/Openix - Ongoing</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="mrrLostInput">MRR Perdido por você (R$ )</label>
            <input type="number" id="mrrLostInput" placeholder="Ex: 950.50">
        </div>

        <div class="results-grid">
            <div class="result-card" id="percentageResult">
                <div class="label">% Perdido</div>
                <div class="value">0%</div>
            </div>
            <div class="result-card" id="statusResult">
                <div class="label">Status da Performance</div>
                <div class="value">-</div>
            </div>
            <div class="result-card" id="discountResult">
                <div class="label">Desconto no Bônus</div>
                <div class="value">R$ 0,00</div>
            </div>
            <div class="result-card" id="bonusResult">
                <div class="label">Bônus Final</div>
                <div class="value">R$ 400,00</div>
            </div>
        </div>
    </div>

    <script>
        // Elementos da interface
        const teamSelect = document.getElementById('teamSelect');
        const mrrLostInput = document.getElementById('mrrLostInput');
        
        const percentageValue = document.querySelector('#percentageResult .value');
        const statusValue = document.querySelector('#statusResult .value');
        const discountValue = document.querySelector('#discountResult .value');
        const bonusValue = document.querySelector('#bonusResult .value');

        // Metas e Bônus
        const goals = {
            acessorias_onboarding: 884.13,
            acessorias_ongoing: 4354.00,
            sittax_openix_onboarding: 1060.21,
            sittax_openix_ongoing: 2549.62
        };
        const baseBonus = 400;

        // Função para formatar como moeda
        function formatCurrency(value) {
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Função principal de cálculo
        function verifyPerformance() {
            const selectedTeam = teamSelect.value;
            const goal = goals[selectedTeam];
            const mrrLost = parseFloat(mrrLostInput.value) || 0;

            // 1. Calcular a porcentagem da meta
            const percentageOfGoal = goal > 0 ? (mrrLost / goal) : 0;
            percentageValue.textContent = `${(percentageOfGoal * 100).toFixed(1)}%`;

            // 2. Determinar o Status e o Desconto
            let statusText = '';
            let bonusDiscount = 0;

            if (percentageOfGoal <= 0.5) {
                statusText = 'Zona Segura';
                bonusDiscount = 0;
            } else if (percentageOfGoal > 0.5 && percentageOfGoal <= 1.0) {
                statusText = 'Zona de Atenção';
                const progressInZone = (percentageOfGoal - 0.5) / 0.5;
                bonusDiscount = progressInZone * (baseBonus * 0.5);
            } else if (percentageOfGoal > 1.0 && percentageOfGoal <= 1.5) {
                statusText = 'Zona Crítica';
                const penaltyBase = baseBonus * 0.5;
                const progressInZone = (percentageOfGoal - 1.0) / 0.5;
                bonusDiscount = penaltyBase + (progressInZone * penaltyBase);
            } else { // Acima de 150%
                statusText = 'Limite da Zona Crítica';
                bonusDiscount = baseBonus;
            }
            
            // Garante que o desconto não passe do valor do bônus
            bonusDiscount = Math.max(0, Math.min(baseBonus, bonusDiscount));
            const finalBonus = baseBonus - bonusDiscount;

            // 3. Atualizar a interface
            statusValue.textContent = statusText;
            discountValue.textContent = formatCurrency(bonusDiscount);
            bonusValue.textContent = formatCurrency(finalBonus);
        }

        // Adiciona os "escutadores" de eventos
        teamSelect.addEventListener('change', verifyPerformance);
        mrrLostInput.addEventListener('input', verifyPerformance);

        // Executa uma vez no início para zerar os campos
        document.addEventListener('DOMContentLoaded', verifyPerformance);
    </script>

</body>
</html>
